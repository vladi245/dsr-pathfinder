# DSR Pathfinder settings. Lines starting with # are comments.

# Guide file, relative to this folder.
guide = guide.txt

# How close (metres, horizontally) counts as reaching a waypoint.
# A step can override it with its own "radius =" line.
waypoint_radius = 4

# Compass calibration. 0 = learn it automatically the first time you run in a straight line.
# Shift+F11 in game resets it.
heading_sign = 1
heading_offset = 3.092844

# Set to 1 if the arrow turns the wrong way when you turn the camera/character.
arrow_mirror = 0

# Route trail drawn in the game world (1 = on, 0 = off). It needs the game's camera, which the
# overlay finds by itself after you turn the camera around for a moment.
trail = 1

# How the trail looks: lights along the route that move one of these ways, or a solid line.
#   embers    = scattered embers drifting forward, flickering, with short tails
#   pulse     = still lights with soft waves of light travelling towards the destination
#   wisps     = two strands of tiny lights spiralling along the path
#   fireflies = sparse lights that fade in, wander and fade out
#   line      = a solid line
trail_style = pulse

# Compass at the top: auto = only when the trail isn't showing, 1 = always, 0 = never.
compass = auto

# Vertical field of view in degrees for the trail. 0 = read it from the game.
# Set it only if the trail drifts sideways from the path as you turn the camera.
camera_fov = 0

# Calm mode (1 = on, 0 = off). While you walk along the route the trail softens and the step panel
# dims to its instruction; standing still for a moment, arriving, a new step or leaving the route
# bring everything back.
calm = 1

# Start Dark Souls Remastered through Steam when the app starts and the game isn't running yet.
launch_game = 1
